name: Build and Run (cih-y2k)

on:
  push:
    branches:
      - 'edidada/**'
  pull_request:
    branches:
      - 'edidada/**'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cmake/g++ are preinstalled; only TBB is needed. The runner's default
      # apt mirror (azure.archive.ubuntu.com) may not resolve, so point apt at
      # the public mirrors; if apt is unavailable entirely, build oneTBB from
      # source (github.com is reachable).
      - name: Install TBB
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu jammy-updates main universe" | sudo tee -a /etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu jammy-security main universe" | sudo tee -a /etc/apt/sources.list
          sudo rm -f /etc/apt/apt-mirrors.txt
          if ! sudo apt-get -o Acquire::Retries=2 update || \
             ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends libtbb-dev; then
            echo "apt unavailable; building oneTBB from source"
            git clone --depth 1 --branch v2021.5.0 https://github.com/oneapi-src/oneTBB.git /tmp/oneTBB
            cmake -S /tmp/oneTBB -B /tmp/oneTBB/build -DTBB_TEST=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/tbb-install -DCMAKE_INSTALL_LIBDIR=lib
            cmake --build /tmp/oneTBB/build --parallel 2
            cmake --install /tmp/oneTBB/build
            echo "CPLUS_INCLUDE_PATH=/tmp/tbb-install/include" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=/tmp/tbb-install/lib" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/tmp/tbb-install/lib" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_FLAGS="-include cstdio -include cstdint -include array -include limits -include chrono"

      - name: Build
        run: cmake --build build --parallel 2

      # main() runs a long benchmark (up to 42M keys x 8 threads), so CI
      # only does a bounded smoke run: start the binary, confirm it does not
      # crash, and stop it after a few seconds.
      - name: Smoke run
        run: |
          set +e
          timeout 15s ./build/BwTree > /tmp/bwtree-smoke.log 2>&1
          rc=$?
          head -n 10 /tmp/bwtree-smoke.log
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "BwTree started successfully (smoke run, exit=$rc)"
          else
            echo "BwTree failed with exit=$rc"
            exit "$rc"
          fi
